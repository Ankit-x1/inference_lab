[project]
name = "edge-vision"
version = "0.1.0"
description = "Edge Vision Inference Lab: accuracy, latency, and model-size trade-offs on Raspberry Pi 5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.1,<3.0",
    "torchvision>=0.16,<1.0",
    "numpy>=1.24,<2.0",
    "onnx>=1.15,<2.0",
    "onnxruntime>=1.16,<2.0",
    "onnxscript>=0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
report = [
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
packages = ["src/edge_vision"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
